<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <link href="styling.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <main class="container">
      <h1>Currency Converter</h1>

      <form>
        <div class="amount">
          <label for="amount">Enter Amount</label>
          <input
            id="amount"
            name="amount"
            type="number"
            value="1"
            min="0"
            step="any"
            required
          />
        </div>

        <div class="dropdown">
          <div class="from">
            <label for="from">From</label>
            <div class="select-container">
              <img src="https://flagsapi.com/US/flat/64.png" alt="US flag" />
              <select id="from" name="from"></select>
            </div>
          </div>

          <i
            class="fa-solid fa-arrow-right-arrow-left"
            aria-hidden="true"
          ></i>

          <div class="to">
            <label for="to">To</label>
            <div class="select-container">
              <img src="https://flagsapi.com/IN/flat/64.png" alt="India flag" />
              <select id="to" name="to"></select>
            </div>
          </div>
        </div>

        <p class="msg" aria-live="polite">
          Select currencies and enter an amount.
        </p>

        <button type="submit">Get Exchange Rate</button>
      </form>
    </main>

   <script src="code.js"></script>
<script src="app.js"></script>
  </body>
</html>
